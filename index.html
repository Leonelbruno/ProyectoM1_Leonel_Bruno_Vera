<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paletas de Colores Aleatorias</title>
    <!--  Tipografia elegida  -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gravitas+One&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">
<!--  conectar con css  -->
<link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- HEADER: Título y descripción -->
    <header class="header">
        <div class="header-contenido">
        <h1 class="titulo-principal">Generador de Paleta de Colores</h1>
        <p class="descripcion">Generador de paletas aleatorias en HSL y HEX</p>
        </div>
    </header>
    <!--Contenedor Principal-->
    <main class="contenedor">
        <!-- Seccion de Botones -->
        <div class="botones-seccion">
            <p class="boton-descripcion">PALETAS</p>
            <div class="botones-contenedor">
            <ul class="botones">
                <li class="lista-boton-6"><button class="boton">6</button></li>
                <li class="lista-boton-8"><button class="boton">8</button></li>
                <li class="lista-boton-9"><button class="boton">9</button></li>
            </ul>
            </div>
            
        </div>
        <div class="generador-contenedor">
        <button class="boton-generador boton">Generar Paleta ⤨</button>
        </div>
        <!--  Paletas  -->
        <section class="paleta"></section>
    </main>


    <!--  Pie de Pagina  -->
    <footer class="footer">Paletas de Colores © 2026 | Hecho con HTML, CSS, JavaScript y DOM </footer>
    <script src="script.js"></script>
</body>
</html>
